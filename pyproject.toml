[project]
name = "medical-questionnaire"
version = "0.1.0"
description = "Веб-приложение для медицинского опроса и мониторинга пациентов"
readme = "README.md"
authors = [
    { name = "unDEFector", email = "kvassin449@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.165,<0.166",
    "greenlet>=3.2,<4",
    "pydantic-settings>=2.12,<3",
    "redis>=7,<8",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "black>=26,<27",
    "httpx>=0.28,<1",
    "isort>=7,<8",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.black]
line-length = 110
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 110

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


