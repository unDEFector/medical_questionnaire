services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DATABASE__DB_NAME:-medical_questionnaire}
      POSTGRES_USER: ${DATABASE__USER_NAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE__USER_NAME: ${DATABASE__USER_NAME:-postgres}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:-postgres}
      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
      DATABASE__DB_NAME: ${DATABASE__DB_NAME:-medical_questionnaire}
      REDIS__HOST: redis
      REDIS__PORT: 6379
      REDIS__DB: ${REDIS__DB:-0}
      APP__ENVIRONMENT: ${APP__ENVIRONMENT:-development}
      APP__FRONTEND_URL: ${APP__FRONTEND_URL:-http://localhost:3000}
      APP__SEED_DEMO_DATA: ${APP__SEED_DEMO_DATA:-true}
      AUTH__SESSION_TTL_HOURS: ${AUTH__SESSION_TTL_HOURS:-24}
      AUTH__ADMIN_ID: ${AUTH__ADMIN_ID:-A-000001}
      AUTH__ADMIN_PASSWORD: ${AUTH__ADMIN_PASSWORD:-admin-demo-password}
      AUTH__BOOTSTRAP_DOCTOR_ENABLED: ${AUTH__BOOTSTRAP_DOCTOR_ENABLED:-true}
      AUTH__DOCTOR_ID: ${AUTH__DOCTOR_ID:-D-000001}
      AUTH__DOCTOR_PASSWORD: ${AUTH__DOCTOR_PASSWORD:-doctor-demo-password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
